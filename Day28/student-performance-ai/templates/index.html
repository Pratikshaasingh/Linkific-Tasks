<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Student Performance Prediction Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI-Powered Student Performance Prediction System</h1>
            <p>Agile Managed Academic Early Warning & Dashboard Platform</p>
        </header>

        <main class="grid-layout">
            <section class="card">
                <h2>Enter Student Data</h2>
                <form id="prediction-form">
                    <div class="form-group">
                        <label>Student Name</label>
                        <input type="text" id="student_name" required placeholder="e.g. Pratiksha Singh">
                    </div>
                    <div class="form-group">
                        <label>Previous Examination Marks (%)</label>
                        <input type="number" id="prev_marks" step="0.1" min="0" max="100" required>
                    </div>
                    <div class="form-group">
                        <label>Attendance Percentage (%)</label>
                        <input type="number" id="attendance" step="0.1" min="0" max="100" required>
                    </div>
                    <div class="form-group">
                        <label>Assignment Score (%)</label>
                        <input type="number" id="assignment_score" step="0.1" min="0" max="100" required>
                    </div>
                    <div class="form-group">
                        <label>Weekly Study Hours</label>
                        <input type="number" id="study_hours" step="0.5" min="0" max="20" required>
                    </div>
                    <div class="form-group">
                        <label>Classroom Participation Score (1-10)</label>
                        <input type="number" id="participation" step="0.1" min="1" max="10" required>
                    </div>
                    <button type="submit" class="btn">Predict Performance</button>
                </form>
            </section>

            <section class="card">
                <h2>Prediction Analytics Result</h2>
                <div id="result-display" class="placeholder-text">
                    Enter student information and submit to calculate AI predictions.
                </div>
            </section>
        </main>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
